# Copy to <your-login>/<your-login>/.github/workflows/profile-showcase.yml
# (the special repo whose README shows on your profile page).
#
# Job art     -> 3D contrib (yoshi389111), snake + heatmap + skyline (github-action-shares)
#                on the `output` branch. The snake heads for the nearest active day and
#                loops in <= 30 s; Platane/snk was dropped (layer-by-colour route, ~85 s loop).
# Job readme  -> rewrites the SHOWCASE:REPOS and SHOWCASE:ACTIVITY blocks in README.md.
# No metrics card: its public-only counts (commits, 0 followers / reviews) contradicted the
# private-inclusive 3D chart, and its language donut duplicated the one in the 3D chart.
name: Profile showcase

on:
  schedule:
    - cron: "17 */8 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-showcase
  cancel-in-progress: false

jobs:
  art:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - run: mkdir -p dist/3d && cp profile-3d-contrib/*.svg dist/3d/
      - name: Snake, heatmap, skyline and stats.json (README badges read stats.json)
        uses: HowardZlh/github-action-shares@v1
        with:
          source: user
          target: ${{ github.repository_owner }}
          label: contributions
          out-dir: dist/art
      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          commit_message: "chore: refresh profile art"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  readme:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: HowardZlh/github-action-shares@v1
        with:
          command: readme
          # replace with your own projects; they are sorted by stars
          repos: SteveZouWonder/dev-notifier,SteveZouWonder/meet-minutes-ai,SteveZouWonder/ollama-qwen-coder-rag-lib-agent
          activity: users:${{ github.repository_owner }}
          skip-repos: ${{ github.repository }}
          limit: 6
      - name: Commit if anything changed
        run: |
          git diff --quiet && { echo "README unchanged"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: refresh README stars and activity"
          git push

